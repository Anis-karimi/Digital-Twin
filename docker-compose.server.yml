services:
  # Server Development service with direct container networking
  dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    image: digital-twin-dev:latest
    container_name: digital-twin-dev
    ports:
      - "5173:5173"
    environment:
      - NODE_ENV=development
      - VITE_BACKEND_URL=${VITE_BACKEND_URL:-}
      - VITE_DGTW_URL=${VITE_DGTW_URL:-https://dgtw.um.ac.ir}
      - VITE_NEW_BACKEND_URL=${VITE_NEW_BACKEND_URL:-}
      - BACKEND_PROXY_URL=${BACKEND_PROXY_URL:-http://bot_svc:7000}
      - LEGACY_BACKEND_PROXY_URL=${LEGACY_BACKEND_PROXY_URL:-http://172.20.13.39:8506}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - default
      - fum_net
    volumes:
      - ./src:/app/src
      - ./public:/app/public
      - ./index.html:/app/index.html
      - ./vite.config.js:/app/vite.config.js
      - ./tailwind.config.js:/app/tailwind.config.js
      - ./postcss.config.js:/app/postcss.config.js
    stdin_open: true
    tty: true

  # Production service served with Nginx
  prod:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - VITE_BACKEND_URL=${VITE_BACKEND_URL:-}
        - VITE_DGTW_URL=${VITE_DGTW_URL:-https://dgtw.um.ac.ir}
    image: digital-twin-prod:latest
    container_name: digital-twin-prod
    restart: unless-stopped
    networks:
      - fum_net
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=chat-bot-um_fum_net"
      - "traefik.http.routers.frontend.rule=PathPrefix(`/`)"
      - "traefik.http.routers.frontend.entrypoints=web"
      - "traefik.http.routers.frontend.priority=20"
      - "traefik.http.services.frontend.loadbalancer.server.port=80"
    profiles:
      - prod

networks:
  default:
    name: digital-twin_net
    ipam:
      driver: default
      config:
        - subnet: 192.168.210.0/24
  fum_net:
    name: ${SHARED_NETWORK:-chat-bot-um_fum_net}
    external: true
