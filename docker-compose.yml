services:
  # Development service with Hot Module Replacement (HMR)
  dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    image: digital-twin-dev:latest
    container_name: digital-twin-dev
    ports:
      - "5173:5173"
    environment:
      - NODE_ENV=development
      - VITE_BACKEND_URL=${VITE_BACKEND_URL:-http://localhost:8000}
      - VITE_DGTW_URL=${VITE_DGTW_URL:-http://localhost:5000}
    volumes:
      - ./src:/app/src
      - ./public:/app/public
      - ./index.html:/app/index.html
      - ./vite.config.js:/app/vite.config.js
    stdin_open: true
    tty: true

  # Production service served with Nginx
  prod:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - VITE_BACKEND_URL=${VITE_BACKEND_URL:-http://localhost:8000}
        - VITE_DGTW_URL=${VITE_DGTW_URL:-http://localhost:5000}
    image: digital-twin-prod:latest
    container_name: digital-twin-prod
    ports:
      - "8080:80"
    restart: unless-stopped
    profiles:
      - prod

networks:
  default:
    name: digital-twin_net
    ipam:
      driver: default
      config:
        - subnet: 192.168.210.0/24

